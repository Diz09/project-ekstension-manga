services:
  app:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: manga_extension_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: manga_extension
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - manga_network

  mysql:
    image: mariadb:10.11
    container_name: manga_extension_mysql
    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: manga_extension

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 5s
      retries: 10

    networks:
      - manga_network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: manga_extension_phpmyadmin

    restart: unless-stopped

    ports:
      - "8001:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - manga_network

networks:
  manga_network:

volumes:
  mysql-data: